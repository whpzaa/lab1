name: security-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Test and security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

      - name: SAST - ESLint security rules
        run: |
          mkdir -p reports
          npx eslint . --format json --output-file reports/eslint.json

      - name: SCA - production and development dependencies
        run: |
          mkdir -p reports
          npm audit --audit-level=high --json > reports/npm-audit.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn

      - name: Publish CI summary
        if: always()
        run: node scripts/ci-summary.mjs
